{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Recipe Book{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recipes/style.css' %}">
</head>
<body>

<div class="container">
    <div class="flourishes"></div>
    <div class="page-header chipped-box">
        <div class="gold-border"></div>
        <h1>Recipe Book</h1>
    </div>
</div>
<div class="container">
    {% block user_controls %}
        <div class="user-controls">
            {% if request.user.is_authenticated %}
                <span>Hi {{ request.user.username | title }}</span>
                <a href="{% url 'logout' %}" class="right-arrow">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="right-arrow">Login</a>
            {% endif %}
        </div>
    {% endblock %}
    {% block content %}{%  endblock %}
</div>
<div class="footer container"></div>
</body>
</html>
