<form method="post" enctype="multipart/form-data" class="{{ form_class }}">{% csrf_token %}
    {% csrf_token %}
    {% for field in form %}
        <div class="field-wrapper">
            {{ field.label_tag }}
            <div class="field type-{{ field.field.widget.input_type  }}">
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        </div>
    {% endfor %}
    <span class="right-arrow">
        <input type="submit" value="{{ button_text }}">
    </span>
</form>
