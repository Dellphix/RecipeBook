<form method="post" enctype="multipart/form-data" class="{{ form_class }}">{% csrf_token %}
    {% csrf_token %}
    {% if form.errors %}
        <div class="form-errors">
            {{ form.non_field_errors  }}
        </div>
    {% endif %}
    {% block fields %}
        {% for field in form %}
            {% include '_base_field.html' %}
        {% endfor %}
    {% endblock %}
    <button type="submit" class="right-arrow">{{ button_text }}</button>
</form>
