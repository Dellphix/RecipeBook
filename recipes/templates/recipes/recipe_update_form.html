{% extends "recipes/recipe_base_page.html" %}

{% block title %} {{ recipe.name }} | Edit {% endblock %}

{% block recipe_title %}
    <div>
        <h3>{{ recipe.name }}</h3>
        <a class="right-arrow" href="{% url 'recipes:detail' recipe.id %}">Back</a>
    </div>
{% endblock %}

{% block recipe_content %}
    <form method="post" class="update-form">{% csrf_token %}
        {{ form.as_p }}
        <span class="right-arrow">
            <input type="submit" value="Update">
        </span>
    </form>
{% endblock %}
